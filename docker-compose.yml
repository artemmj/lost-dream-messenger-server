services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: db_messenger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes: [postgres_data:/var/lib/postgresql]
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_messenger"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: .
    # Переносы строк внутри sh -c "..." — отдельные команды: каждую команду держим
    # на одной строке, иначе аргументы daphne уедут в собственный запуск.
    command: >
      sh -c "python manage.py migrate &&
              python manage.py collectstatic --noinput &&
              daphne -b 0.0.0.0 -p 8000 --websocket-max-message-size 16384 config.asgi:application"
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      # Ключ service account лежит в ./secrets/ (вне git и вне образа — см.
      # .dockerignore) и виден в контейнере через mount `.:/app`. PUSH_ENABLED,
      # FIREBASE_PROJECT_ID и — для тех, кому удобнее env вместо файла —
      # FIREBASE_CREDENTIALS_JSON приходят из .env.
      - FIREBASE_CREDENTIALS_PATH=/app/secrets/firebase-service-account.json
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      target: dev          # ← dev stage из Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app         # ← Монтируем исходники для HMR
      - /app/node_modules       # ← Исключаем node_modules из mount (контейнерные зависимости)
    depends_on:
      - backend

volumes:
  postgres_data:
  media_data:
